name: Deploy Skill Development

on:
  push:
    branches:
      - feature/ganesh

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo SSH connection successful"

      - name: Deploy application
        run: |
          rsync -avz --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="venv/" \
            --exclude="*.db" \
            -e "ssh -i ~/.ssh/ec2_key" \
            ./ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/skill_development/"

      - name: Install dependencies
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /var/www/skill_development && \
             /var/www/skill_development/venv/bin/pip install -r requirements.txt"

      - name: Restart application
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo systemctl restart skill-development"

      - name: Check application
        run: |
          ssh -i ~/.ssh/ec2_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "curl -f http://127.0.0.1:8000/"